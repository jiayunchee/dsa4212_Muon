# E2 (notes/protocol.md, Section 4): shared phase. Exact-SVD Muon (p = 0) at its E1-tuned
# learning rate for each batch size, two momentum values, five seeds; a checkpoint and the
# noise diagnostics (E4) at the switch point. E3 branches continue from these checkpoints.
experiment: e2_shared

base:
  seed: 0
  threads: 1
  task: {d_in: 128, teacher_hidden: [64, 64], d_out: 16, power: 1.0, label_noise: 0.5, teacher_seed: 0}
  eval_size: 16384
  eval_seed: 12345
  model: {widths: [128, 256, 256, 256, 16], activation: tanh}
  batch_size: 16
  steps: 3000
  eval_every: 50
  schedule: constant
  checkpoint_at: [3000]
  diagnostics_at: [3000]
  diagnostics_k: 32
  optimizer:
    name: muon
    update: spectral
    p: 0.0
    momentum: 0.95
    lr: {by: batch_size, map: {16: 0.003, 64: 0.001, 256: 0.001, 1024: 0.001}}
    adam_lr: {by: batch_size, map: {16: 3.0e-4, 64: 1.0e-3, 256: 1.0e-3, 1024: 1.0e-3}}  # best AdamW lr per B (E1a)

grid:
  batch_size: [16, 64, 256, 1024]
  optimizer.momentum: [0.9, 0.95]
  seed: [0, 1, 2, 3, 4]

arms:
  - label: shared
