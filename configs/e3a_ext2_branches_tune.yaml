# E3a extension 2 (generated by `code/analyze_branches.py extend`, protocol Section 6):
# 5 cells had their best multiplier at the low edge and 2 at the high edge,
# so 2 more multipliers beyond each edge are tried on the tuning seeds.
experiment: e3_branches
base:
  seed: 0
  threads: 1
  task:
    d_in: 128
    teacher_hidden:
    - 64
    - 64
    d_out: 16
    power: 1.0
    label_noise: 0.5
    teacher_seed: 0
  eval_size: 16384
  eval_seed: 12345
  model:
    widths:
    - 128
    - 256
    - 256
    - 256
    - 16
    activation: tanh
  batch_size: 16
  steps: 3000
  eval_every: 50
  schedule: constant
  optimizer:
    name: muon
    update: spectral
    p: 0.0
    momentum: 0.95
    lr: 0.01
    adam_lr: 0.001
  branch:
    checkpoint: checkpoints/e2_shared/shared_B{batch_size}_m{optimizer.momentum}_s{seed}_step3000.pt
    lr_multiplier: 1.0
grid:
  seed:
  - 0
  - 1
arms:
- label: p-0.25
  set:
    branch:
      update: spectral
      p: -0.25
      normalize: true
  sweep:
    branch.lr_multiplier:
    - 16.0
    - 32.0
    batch_size:
    - 64
    optimizer.momentum:
    - 0.9
- label: p-0.25
  set:
    branch:
      update: spectral
      p: -0.25
      normalize: true
  sweep:
    branch.lr_multiplier:
    - 16.0
    - 32.0
    batch_size:
    - 256
    optimizer.momentum:
    - 0.9
- label: p0.5
  set:
    branch:
      update: spectral
      p: 0.5
      normalize: true
  sweep:
    branch.lr_multiplier:
    - 0.0625
    - 0.03125
    batch_size:
    - 16
    optimizer.momentum:
    - 0.95
- label: p1
  set:
    branch:
      update: spectral
      p: 1.0
      normalize: true
  sweep:
    branch.lr_multiplier:
    - 0.0625
    - 0.03125
    batch_size:
    - 16
    optimizer.momentum:
    - 0.9
- label: p1
  set:
    branch:
      update: spectral
      p: 1.0
      normalize: true
  sweep:
    branch.lr_multiplier:
    - 0.0625
    - 0.03125
    batch_size:
    - 16
    optimizer.momentum:
    - 0.95
- label: xie
  set:
    branch:
      update: plain
      lr_reference: xie
      k: 32
  sweep:
    branch.lr_multiplier:
    - 0.0625
    - 0.03125
    batch_size:
    - 16
    optimizer.momentum:
    - 0.9
- label: xie
  set:
    branch:
      update: plain
      lr_reference: xie
      k: 32
  sweep:
    branch.lr_multiplier:
    - 0.0625
    - 0.03125
    batch_size:
    - 16
    optimizer.momentum:
    - 0.95
