# E3a (notes/protocol.md, Section 4): branches on the tuning seeds {0, 1}. From each E2
# checkpoint, continue 3000 steps with each update rule and each learning-rate multiplier.
# `code/analyze_branches.py select` then picks one multiplier per (arm, B, momentum) and writes
# configs/e3b_branches_eval.yaml for the evaluation seeds {2, 3, 4}.
experiment: e3_branches

base:
  seed: 0
  threads: 1
  task: {d_in: 128, teacher_hidden: [64, 64], d_out: 16, power: 1.0, label_noise: 0.5, teacher_seed: 0}
  eval_size: 16384
  eval_seed: 12345
  model: {widths: [128, 256, 256, 256, 16], activation: tanh}
  batch_size: 16
  steps: 3000
  eval_every: 50
  schedule: constant
  optimizer: {name: muon, update: spectral, p: 0.0, momentum: 0.95, lr: 0.01, adam_lr: 1.0e-3}  # overwritten by the checkpoint
  branch:
    checkpoint: "checkpoints/e2_shared/shared_B{batch_size}_m{optimizer.momentum}_s{seed}_step3000.pt"
    lr_multiplier: 1.0

grid:
  batch_size: [16, 64, 256, 1024]
  optimizer.momentum: [0.9, 0.95]
  seed: [0, 1]

arms:
  - label: p-0.25
    set: {branch: {update: spectral, p: -0.25, normalize: true}}
    sweep: {branch.lr_multiplier: [0.5, 1.0, 2.0]}
  - label: p0
    set: {branch: {update: spectral, p: 0.0, normalize: true}}
    sweep: {branch.lr_multiplier: [0.5, 1.0, 2.0]}
  - label: p0.5
    set: {branch: {update: spectral, p: 0.5, normalize: true}}
    sweep: {branch.lr_multiplier: [0.5, 1.0, 2.0]}
  - label: p1
    set: {branch: {update: spectral, p: 1.0, normalize: true}}
    sweep: {branch.lr_multiplier: [0.5, 1.0, 2.0]}
  - label: ns5
    set: {branch: {update: ns5}}
    sweep: {branch.lr_multiplier: [0.5, 1.0, 2.0]}
  - label: xie
    set: {branch: {update: plain, lr_reference: xie, k: 32}}
    sweep: {branch.lr_multiplier: [0.5, 1.0, 2.0]}
