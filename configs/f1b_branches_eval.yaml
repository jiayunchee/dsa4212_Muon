# F1 evaluation (generated by `code/analyze_branches.py select`): each arm uses the
# learning-rate multiplier chosen on tuning seeds {0, 1}; evaluated on seeds {2, 3, 4}.
experiment: e3_branches
base:
  seed: 0
  threads: 1
  task:
    d_in: 128
    teacher_hidden:
    - 64
    - 64
    d_out: 16
    power: 1.0
    label_noise: 0.5
    teacher_seed: 0
  eval_size: 16384
  eval_seed: 12345
  model:
    widths:
    - 128
    - 256
    - 256
    - 256
    - 16
    activation: tanh
  batch_size: 16
  steps: 3000
  eval_every: 50
  schedule: constant
  optimizer:
    name: muon
    update: spectral
    p: 0.0
    momentum: 0.95
    lr: 0.01
    adam_lr: 0.001
  branch:
    checkpoint: checkpoints/e2_shared/shared_B{batch_size}_m{optimizer.momentum}_s{seed}_step3000.pt
    lr_multiplier: 1.0
grid:
  seed:
  - 2
  - 3
  - 4
arms:
- label: p-0.75
  set:
    branch:
      update: spectral
      p: -0.75
      normalize: true
  sweep:
    branch.lr_multiplier:
    - 4.0
    batch_size:
    - 16
    optimizer.momentum:
    - 0.9
- label: p-0.75
