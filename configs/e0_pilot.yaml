# E0 pilot (notes/protocol.md, Section 4): timing, learning-rate ranges, how long until the
# excess risk plateaus at constant learning rate. One seed, the two extreme batch sizes.
experiment: e0_pilot

base:
  seed: 0
  threads: 1
  task: {d_in: 128, teacher_hidden: [64, 64], d_out: 16, power: 1.0, label_noise: 0.5, teacher_seed: 0}
  eval_size: 16384
  eval_seed: 12345
  model: {widths: [128, 256, 256, 256, 16], activation: tanh}
  batch_size: 16
  steps: 6000
  eval_every: 200
  schedule: constant
  diagnostics_at: [1000, 3000, 6000]
  diagnostics_k: 16

grid:
  batch_size: [16, 1024]

arms:
  - label: adamw
    set: {optimizer: {name: adamw}}
    sweep: {optimizer.lr: [1.0e-3, 3.0e-3]}
  - label: sgd
    set: {optimizer: {name: sgd, momentum: 0.9}}
    sweep: {optimizer.lr: [0.03, 0.1]}
  - label: muon-ns5
    set: {optimizer: {name: muon, update: ns5, momentum: 0.95, adam_lr: 1.0e-3}}
    sweep: {optimizer.lr: [0.01, 0.03]}
  - label: muon-exact
    set: {optimizer: {name: muon, update: spectral, p: 0.0, momentum: 0.95, adam_lr: 1.0e-3}}
    sweep: {optimizer.lr: [0.01, 0.03]}
