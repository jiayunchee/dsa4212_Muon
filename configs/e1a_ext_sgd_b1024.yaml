# E1a extension (protocol, Section 6): SGD's best learning rate at B = 1024 was the top of its
# grid (0.3), so the grid is extended upwards for that cell only. Added 20 Oct 2026.
experiment: e1_baselines

base:
  seed: 0
  threads: 1
  task: {d_in: 128, teacher_hidden: [64, 64], d_out: 16, power: 1.0, label_noise: 0.5, teacher_seed: 0}
  eval_size: 16384
  eval_seed: 12345
  model: {widths: [128, 256, 256, 256, 16], activation: tanh}
  batch_size: 1024
  steps: 6000
  eval_every: 100
  schedule: constant

grid:
  batch_size: [1024]
  seed: [0, 1]

arms:
  - label: sgd
    set: {optimizer: {name: sgd, momentum: 0.9}}
    sweep: {optimizer.lr: [0.6, 1.0]}
